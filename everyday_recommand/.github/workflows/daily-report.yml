name: Daily Paper Report

on:
  schedule:
    # Weekdays Mon-Fri at 09:00 CST (01:00 UTC)
    - cron: "0 1 * * 1-5"
  workflow_dispatch:  # allow manual trigger

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          EXA_API_KEY=${{ secrets.EXA_API_KEY }}
          SMTP_SERVER=${{ secrets.SMTP_SERVER }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SENDER=${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_RECEIVER=${{ secrets.SMTP_RECEIVER }}
          ENVEOF

      - name: Create email.json from secrets
        run: |
          mkdir -p config
          cat > config/email.json << 'JSONEOF'
          {
            "smtp": {
              "host": "${{ secrets.SMTP_SERVER }}",
              "port": ${{ secrets.SMTP_PORT }},
              "secure": true,
              "auth": {
                "user": "${{ secrets.SMTP_SENDER }}",
                "pass": "${{ secrets.SMTP_PASSWORD }}"
              }
            },
            "from": "日报机器人 <${{ secrets.SMTP_SENDER }}>",
            "to": "${{ secrets.SMTP_RECEIVER }}",
            "subject_prefix": "[量子光学日报]"
          }
          JSONEOF

      - name: Run daily pipeline
        run: node scripts/daily_pipeline.mjs

      - name: Commit & push reports back
        if: success()
        run: |
          git config user.name "quantum-optics-bot"
          git config user.email "bot@quantum-optics.local"
          git add reports/ data/pushed_papers.json data/memory.json
          git diff --staged --quiet || (git commit -m "Daily report $(date +%Y-%m-%d)" && git push)
